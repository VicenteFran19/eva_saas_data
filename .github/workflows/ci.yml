name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 (requerido por PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Validar que los YAML de configuracion cargan correctamente
        run: |
          python - << 'EOF'
          from saas_pipeline.config import load_config, list_available_tenants

          for env in ["dev", "qa", "main"]:
              cfg = load_config(env=env, tenant="all", start_date="2025-01-01", end_date="2025-01-31")
              assert cfg.paths.bronze, f"paths.bronze vacio en env={env}"

          for tenant in list_available_tenants():
              cfg = load_config(env="dev", tenant=tenant, start_date="2025-01-01", end_date="2025-01-31")
              assert cfg.execution.tenant == tenant

          print(f"OK: {len(list_available_tenants())} tenants y 3 ambientes cargan correctamente.")
          EOF

      - name: Run unit tests (pytest)
        run: pytest tests/ -v
